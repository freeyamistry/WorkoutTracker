<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171815">
    <meta name="description" content="Workout Tracker — a bright, private workout tracker that keeps every rep saved in your browser.">
    <title>Workout Tracker</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="app-shell">
        <header class="topbar">
            <button class="brand" type="button" data-view="today" aria-label="Workout Tracker home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32"><path d="M8 10v12M4 13v6m20-9v12m4-9v6M8 16h16"/></svg>
                </span>
                <span>Workout <strong>Tracker</strong></span>
            </button>

            <nav class="desktop-nav" aria-label="Primary navigation">
                <button type="button" class="nav-link is-active" data-view="today">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M3 10v4m15-6v8m3-6v4M6 12h12"/></svg>
                    <span>Workout</span>
                </button>
                <button type="button" class="nav-link" data-view="progress">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>
                    <span>Progress</span>
                </button>
                <button type="button" class="nav-link" data-view="calendar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg>
                    <span>Calendar</span>
                </button>
            </nav>

        </header>

        <main id="main-content">
            <section id="today-view" class="view-panel" aria-labelledby="today-title"></section>
            <section id="progress-view" class="view-panel" aria-labelledby="progress-title" hidden></section>
            <section id="calendar-view" class="view-panel" aria-labelledby="calendar-title" hidden></section>
        </main>

        <nav class="mobile-nav" aria-label="Primary navigation">
            <button type="button" class="mobile-nav-link is-active" data-view="today">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M3 10v4m15-6v8m3-6v4M6 12h12"/></svg>
                <span>Workout</span>
            </button>
            <button type="button" class="mobile-nav-link" data-view="progress">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>
                <span>Progress</span>
            </button>
            <button type="button" class="mobile-nav-link" data-view="calendar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg>
                <span>Calendar</span>
            </button>
        </nav>
    </div>

    <dialog id="app-dialog" aria-labelledby="dialog-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
